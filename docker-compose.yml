services:
  image-recognition:
    build: .
    container_name: image-recognition-app
    ports:
      - "8501:8501"
    volumes:
      - ./src/image_recognition_network/main.py:/app/src/image_recognition_network/main.py
      - ./src/image_recognition_network/models:/app/src/image_recognition_network/models
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_CLIENT_LOGGER_LEVEL=error
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 2G
